[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
orphan_prefix = "+"
title_format = "## [{version}] — {project_date}"

[[tool.towncrier.type]]
directory = "feature"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "change"
name = "Changed"
showcontent = true
